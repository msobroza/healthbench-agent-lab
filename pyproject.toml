[project]
name = "healthbench-agent"
version = "0.1.0"
description = "Building, evaluating, and iterating on agentic AI systems for health question answering — benchmarked against HealthBench."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    # Agent framework
    "google-adk[eval]>=1.0.0",

    # Data analysis
    "pandas>=2.2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.9.0",

    # Experiment tracking
    "mlflow>=2.18.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.3.0",
    "ipywidgets>=8.1.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
optimization = [
    "dspy>=2.5.0",
    "textgrad>=0.1.4",
]

[project.scripts]
download-healthbench = "healthbench_agent.dataset.loader:_cli"
track-experiment = "healthbench_agent.llm_eval.cli.track_experiment:main"
optimize-prompt = "healthbench_agent.prompt_optimization.cli:main"
meta-evaluate-judge = "healthbench_agent.llm_eval.cli.meta_eval:main"

[build-system]
requires = ["uv_build>=0.5.15"]
build-backend = "uv_build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "jupyterlab>=4.3.0",
    "ipywidgets>=8.1.0",
    "pytest-cov>=7.1.0",
    "pandas-stubs>=3.0.0.260204",
    "types-pyyaml>=6.0.12.20250915",
    "scipy-stubs>=1.17.1.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# GRADER_TEMPLATE is verbatim from simple-evals — must not be reformatted.
"src/healthbench_agent/llm_eval/grading/judge.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cache-clear"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "seaborn.*", "mlflow.*", "dspy.*", "textgrad.*", "tabulate.*", "tqdm.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false
