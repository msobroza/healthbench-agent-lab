[project]
name = "healthbench-agent-lab"
version = "0.1.0"
description = "Building, evaluating, and iterating on agentic AI systems for health question answering — benchmarked against HealthBench."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    # Agent framework
    "google-adk[eval]>=1.0.0",

    # Data analysis
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.9.0",

    # Experiment tracking
    "mlflow>=2.18.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.3.0",
    "ipywidgets>=8.1.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "jupyterlab>=4.3.0",
    "ipywidgets>=8.1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true