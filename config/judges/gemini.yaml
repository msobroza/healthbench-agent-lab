# Gemini LLM-as-judge configuration
#
# Uses Gemini 2.5 Flash for rubric-based grading. Flash is the best
# balance of cost, speed, and accuracy for judge workloads — it handles
# the structured grading prompt well at ~10x lower cost than Pro.
#
# Usage:
#   uv run track-experiment \
#       --agent-config config/agents/baseline_agent.yaml \
#       --judge-config config/judges/gemini.yaml

provider: gemini
model: gemini-2.5-flash
temperature: 0.0
max_retries: 5
timeout_seconds: 60
max_workers: 80
mode: async
prompt_path: prompts/llm_grader/v1_llm_grader.yaml
